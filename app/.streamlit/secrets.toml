# Copiez ce fichier en `.streamlit/secrets.toml` et renseignez vos valeurs.
# Sur Streamlit Cloud : Settings > Secrets (collez ce contenu).

ADMIN_EMAIL = "admin@weekend.fr"
ADMIN_PASSWORD = "admin123"

# URL publique de l'application (pour le lien de réinitialisation)
APP_URL = "http://localhost:8501"

# Envoi d'email via Gmail (utilisez un "mot de passe d'application" Google, PAS votre mot de passe habituel)
# https://myaccount.google.com/apppasswords
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
GMAIL_ADDRESS = "votreadresse@gmail.com"
GMAIL_APP_PASSWORD = "xxxxxxxxxxxxxxxx"

